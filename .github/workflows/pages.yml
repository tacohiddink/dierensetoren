# Publiceert de site op GitHub Pages. Elke "?v=dev" in de HTML en CSS wordt
# vervangen door de commit-hash, zodat browsers na een wijziging direct de
# nieuwe CSS, JS en foto's ophalen in plaats van een oude versie uit de cache.
name: Publiceer site

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Site samenstellen met versienummer
        run: .github/scripts/bouw.sh "${GITHUB_SHA::7}"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
